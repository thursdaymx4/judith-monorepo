appId: com.app.judith
name: Ask Judith — 20 text-only spot-check questions

# Runs the common Ask Judith questions through the chat path only.
# The deep-link flag `chatOnly=1` disables spoken follow-up audio, so this
# flow does not consume ElevenLabs API even on a Voice-tier account.
---
- launchApp:
    clearState: false
- waitForAnimationToEnd
- openLink: "judith:///ask?chatOnly=1"
- waitForAnimationToEnd
- assertVisible: "Ask Judith"
- assertVisible:
    accessibilityText: "Ask Judith question input ready"

- tapOn:
    accessibilityText: "Ask Judith question input ready"
- eraseText: 200
- inputText: "What's due this week and how much?"
- pressKey: Enter
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      accessibilityText: "Ask Judith question input ready"
    timeout: 45000
- assertNotVisible: "May problema sa server"
- assertNotVisible: "Something went wrong on my end"
- assertNotVisible: "I can't connect to the server"
- assertNotVisible: "Hindi ako makakonekta sa server"
- assertNotVisible: "Sorry, that took too long"
- assertNotVisible: "Pasensya, ang tagal ng sagot"

